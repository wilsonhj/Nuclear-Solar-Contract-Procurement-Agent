[project]
name = "procurement-agent"
version = "0.1.0"
description = "Agentic human-in-the-loop RAG pipeline for solar-plus-storage component procurement"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# Core stays deliberately thin. Every heavy dependency sits behind an extra so
# that NFR-04 (parsers, OCR, embedders, vector store, reranker, LLM must be
# swappable) is enforced by packaging, not just by convention.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Pinned EXACTLY, not >=. docProps/app.xml literally embeds the string
    # "Openpyxl 3.1.5", so a patch bump changes the output bytes and breaks
    # every historical AC-7 hash with zero data change. See plan.md Decision 8c.
    "openpyxl==3.1.5",
    # Pinned EXACTLY, for openpyxl's reason rather than openpyxl's mechanism.
    # This library decides the bytes `audit.event.hash` covers (clarifications.md
    # D-13), so any change in its output re-bases every chain ever written while
    # the data stands still - the A-6 class of defect wearing a dependency hat.
    # A `~=0.1.4` bound would admit 0.1.5, and under PEP 440 a 0.x minor is not
    # a compatibility promise; RFC 8785 conformance is a property of the release
    # this repo's test vectors ran against, not of the version range. Core rather
    # than an extra because the audit envelope is not swappable infrastructure:
    # NFR-04's extras exist for parsers, embedders and stores, and C4 is none of
    # those. Zero runtime dependencies and Apache-2.0 (PyPI, 2026-08-12), so it
    # neither widens the dependency surface nor touches the licence gate.
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
# Document parsing / OCR. Apache-2.0, MIT and BSD only. Research verified licences at
# primary sources and rejected: Marker (weights revenue-capped), Surya (GPL-3.0),
# MinerU (AGPL-3.0), olmOCR (Rail-M revenue cap). See plan.md licence gate.
#
# PyMuPDF was declared here for per-page text-layer detection and removed: it is
# "GNU AFFERO GPL 3.0 or Artifex Commercial", so it failed the same gate three
# lines above it. Docling reports per-page text coverage, and pypdfium2
# (BSD-3/Apache-2.0) is the fallback if a dedicated probe is needed.
parse = [
    "docling>=2.115",
    "pandas>=2.2",
]
# Schema-constrained extraction against a self-hosted vLLM endpoint.
# NOTE: use json_schema mode, NOT Instructor's default TOOLS mode - tool calls
# do not emit logprobs, which discards the confidence signal. plan.md Decision 7.
extract = [
    "instructor>=1.15",
    "openai>=1.50",
]
# Postgres-backed stage state machine and canonical store (plan Decisions 1, 3a, 9).
store = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
# CEC equipment-list cross-check (FR-WEB-05 authority tier).
# WARNING: pvlib's BUNDLED CEC library is frozen at March 2019 and contains ZERO
# modules >=600 W, while this project's modules are 600-740 W. Never call
# retrieve_sam() with defaults - pass path= pointing at a pinned copy of the live
# SAM CSV. See clarifications.md D-8a.
solar = [
    "pvlib>=0.11",
]
dev = [
    "pytest>=8.3",
    "types-openpyxl>=3.1",
    "ruff>=0.7",
    "mypy>=1.11",
    # tests/test_sql_behaviour.py imports it, so `mypy --strict` over `tests`
    # needs it present or the module is an unresolvable import. It ships its own
    # type information, so no stub package is required. This is the same driver
    # the `store` extra pins for runtime; here it is a test dependency, and the
    # behaviour suite still skips itself unless PROCUREMENT_TEST_DSN is set.
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
# `files`, not `packages`: with packages = ["procurement_agent"] mypy never
# looked at tests/, so every "mypy strict clean" claim covered source only.
files = ["src", "tests"]
mypy_path = "src"
strict = true
